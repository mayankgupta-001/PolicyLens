name: Organize PolicyLens Part 1

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  organize:
    if: github.event.head_commit.message != 'chore: organize Part 1 files'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Move Part 1 files
        shell: bash
        run: |
          set -e
          mkdir -p part1_preprocessing

          if [ -d data ]; then git mv data part1_preprocessing/data; fi
          if [ -d src ]; then git mv src part1_preprocessing/src; fi
          if [ -d scripts ]; then git mv scripts part1_preprocessing/scripts; fi
          if [ -f annotation_guidelines.md ]; then git mv annotation_guidelines.md part1_preprocessing/annotation_guidelines.md; fi

          # Keep repository-level configuration shared by all four parts.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to move."
            exit 0
          fi

          git commit -m "chore: organize Part 1 files"
          git push
